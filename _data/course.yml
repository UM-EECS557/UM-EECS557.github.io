description:  EECS 557 studies 
 communication networks through the mathematical principles that govern their design, performance, and control. The course connects Internet protocols with the models used to reason about congestion, routing, scheduling, queueing, switching, and resource allocation.

 The first part of the course introduces Internet architecture, protocol layers, TCP, adaptive window flow control, routing, and network planning. The second part develops the analytical foundations needed to study network behavior, including convex optimization, utility maximization, Markov chains, queueing theory, packet switching, fair queueing, wireless scheduling, and network calculus. The course also discusses modern networked systems such as peer-to-peer networks, data-center load balancing, and cross-layer resource optimization.

 By the end of the course, students should be able to model communication networks mathematically, analyze their performance, and understand how protocol and algorithmic choices shape efficiency, fairness, stability, and scalability.

hero_note: EECS 557 develops the mathematical foundations needed to model, analyze, and design communication networks, connecting Internet protocols with optimization, queueing, routing, scheduling, congestion control, and resource allocation.