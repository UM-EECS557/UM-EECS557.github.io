- id: projects
  title: Projects
  markdown: 'You will complete **a set of projects** through the semester. In these projects, you will design and implement various communication network scenarios to understand the concepts discussed in the lectures. 

    The projects should be independent to each other. 

    For further details on the projects, please refer to the [Projects Overview]() page.'

